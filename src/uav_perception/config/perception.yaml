# Параметры нод компьютерного зрения (запускаются из venv, см. setup_venv.sh).
marker_detector:
  ros__parameters:
    camera_topic: "/camera/image_raw"   # источник RGB-кадров
    detection_topic: "/detections"      # куда публиковать TargetDetection

human_detector:
  ros__parameters:
    yolo_model: "yolov8n.pt"            # путь к весам YOLO
    conf_threshold: 0.5                 # порог уверенности
    camera_topic: "/camera/image_raw"
    detection_topic: "/detections"
    # COCO-классы для публикации (имена как в словаре YOLO: с пробелами).
    classes: ["person", "car", "traffic light", "stop sign"]
