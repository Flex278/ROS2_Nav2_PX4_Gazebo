/**:
  ros__parameters:
    # Высота взлёта и время зависания до полёта по точкам
    takeoff_height: 2.0
    hover_time: 3.0
    # Частота публикации setpoint (PX4 требует непрерывный поток)
    update_rate: 30.0
    # Маршрут в ENU (x — север, y — восток, z — вверх).
    # Плоский список троек [x0,y0,z0, x1,y1,z1, ...] — ROS2-параметры
    # не поддерживают вложенные списки.
    waypoints: [0.0, 0.0, 2.0, 2.0, 0.0, 2.0, 2.0, 2.0, 2.0, 0.0, 2.0, 2.0, 0.0, 0.0, 2.0]
