/**:
  ros__parameters:
    # Высота взлёта/удержания при следовании за Nav2 (ENU, z вверх)
    takeoff_height: 3.0
    # Частота публикации setpoint (PX4 требует непрерывный поток)
    update_rate: 30.0
    # Ограничение горизонтальной скорости из /cmd_vel [м/с].
    # Совпадает с max_vel_x/y в DWB (0.6) — дрон не должен разгоняться быстрее плана.
    max_speed: 0.6
    # Максимальное удаление «морковки» (целевой позиции) от дрона [м].
    # Было 4.0 — позиционный контроллер разгонялся до ~4 м/с, перелетал цель,
    # морковка прыгала за дрон и дрон «крутился/переворачивался» (осцилляция у цели 5).
    max_ahead: 1.5
    # Время упреждения «морковки» [с]: цель = позиция + cmd_vel * lookahead_time.
    # ~1/MPC_XY_P (≈0.95) даёт почти точное слежение за cmd_vel без интеграции.
    lookahead_time: 1.0
    # Пауза после остановки cmd_vel, после которой начинается посадка [с].
    # Снижено с 45 до 8: 45 с давали неприемлемо долгую паузу перед посадкой
    # после последней цели. 8 с достаточно, чтобы пережить кратковременную
    # остановку/осцилляцию DWB у цели (recovery), но не затягивает финальную
    # посадку. Если дрон начнёт садиться в середине миссии — вернуть выше.
    stop_timeout: 8.0
